[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent-learning"
version = "0.1.0"
description = "A six-stage research agent learning repository"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.6,<1", "langgraph>=1,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[project.scripts]
my-agent = "my_agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
